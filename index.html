<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alex Pruett</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at center, #1a1a1a, #000);
    font-family: 'Segoe UI', sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }

  h1 {
    font-size: 60px;
    margin-bottom: 10px;
    text-shadow: 0 0 20px #00eaff;
  }

  p {
    font-size: 22px;
    color: #ccc;
  }

  .glow {
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { text-shadow: 0 0 10px #00eaff; }
    50% { text-shadow: 0 0 25px #00eaff; }
    100% { text-shadow: 0 0 10px #00eaff; }
  }

  .footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    font-size: 14px;
    color: #444;
  }
</style>
</head>
<body>

<h1 class="glow">AlexPruett.com</h1>
<p>A domain with no purpose… but plenty of style.</p>

<div class="footer">© 2026 Alex Pruett</div>

</body>
</html>
