<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alex Pruett</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #4b79a1, #283e51);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    font-family: Arial, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  h1 {
    font-size: 55px;
    margin-bottom: 20px;
  }

  .card {
    background: rgba(255,255,255,0.1);
    padding: 30px;
    width: 420px;
    margin: 0 auto;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px rgba(0,0,0,0.3);
  }

  p {
    font-size: 20px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>AlexPruett.com</h1>

<div class="card">
  <p>This domain doesn’t have a mission.</p>
  <p>It doesn’t have a plan.</p>
  <p>It just… exists.</p>
</div>

</body>
</html>
